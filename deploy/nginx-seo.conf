# Include inside the existing HTTPS server block for ml-atlas.ksh.ai.kr.
# Keep its root, TLS, security headers and reverse-proxy settings as appropriate.
# Replace the old SPA `location / { try_files ... /index.html; }` block with this.
error_page 404 /404.html;

location = /404.html {
    internal;
}

location = /robots.txt {
    types { }
    default_type text/plain;
    try_files /robots.txt =404;
}

location = /sitemap.xml {
    types { }
    default_type application/xml;
    try_files /sitemap.xml =404;
}

location ^~ /assets/ {
    # Vite fingerprints JS/CSS filenames; new builds get new URLs.
    try_files $uri =404;
    expires 1y;
}

location = /index.html {
    return 301 /$is_args$args;
}

location = /transformer {
    return 301 /lesson/transformer$is_args$args;
}

# The HTML compatibility redirect retains old #attention etc. fragments.
location = /transformer/index.html {
    try_files /transformer/index.html =404;
}

location ~ ^/lesson/transformer/(structure|attention|heads|blocks|cache)/?$ {
    return 301 /lesson/transformer;
}

location ~ ^/(lesson/[a-z0-9-]+|category/[a-z0-9-]+|graph|saved|completed)/index\.html$ {
    return 301 /$1$is_args$args;
}

location ~ ^/(lesson/[a-z0-9-]+|category/[a-z0-9-]+|graph|saved|completed)/$ {
    return 301 /$1$is_args$args;
}

location / {
    # Try the pre-rendered HTML BEFORE an existing directory, avoiding slash redirects.
    # Missing resources keep HTTP 404 instead of returning the homepage with HTTP 200.
    try_files $uri/index.html $uri =404;
}
